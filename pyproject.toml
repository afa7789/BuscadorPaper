[project]
name = "research-graph"
version = "0.1.0"
description = "Local-first bibliometric mapping: seed papers -> typed knowledge graph -> markdown report with LLM-derived project proposals"
authors = [
    { name = "Arthur Abeilice", email = "afa7789@gmail.com" }
]
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "networkx>=3.2,<4",
    "python-louvain>=0.16,<1",
    "pyvis>=0.3.2,<1",
    "pypdf>=4.0,<6",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "beautifulsoup4>=4.12,<5",   # for annas archive provider
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10,<1"]  # optional: better reference-line layout

[project.scripts]
research-graph = "research_graph.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"
