project:
  name: "zk-blockchain-research-map"
  language: "pt-BR"
  output_dir: "./output"
  cache_dir: "./cache"
  log_level: "INFO"

seed_inputs:
  # Nota: os seeds em PDF (3795774.pdf, 3805044.pdf, zk_defi_super.pdf) foram
  # removidos do repo em 15/09/2026 junto com a reorganização — o mecanismo de
  # busca vive neste repo; as propostas de pesquisa ficam no diretório pai
  # (../2026-09-13-open-problems). Para semear por PDF, aponte para o arquivo
  # local desejado, ex.: value: "./meu_paper.pdf".
  - type: "title"
    value: "Tornado Cash Privacy Solution"
  - type: "url"
    value: "https://arxiv.org/abs/2202.06877"                    # A Review of zk-SNARKs
  - type: "title"
    value: "Zswap: zk-SNARK Based Non-Interactive Multi-Asset Swaps"  # eprint 2022/1002
  - type: "crossref_query"
    value: "zero knowledge decentralized exchange private swap"
  - type: "crossref_query"
    value: "privacy preserving lending protocol zero knowledge collateral"
  - type: "crossref_query"
    value: "confidential DeFi zk-SNARK proof of solvency reserves"
  - type: "crossref_query"
    value: "zero knowledge mixer anonymity set Ethereum"
  - type: "crossref_query"
    value: "private automated market maker zero knowledge"
  # --- Linhas de pesquisa: membership structure / proof system / protocolo ---
  - type: "crossref_query"
    value: "cryptographic accumulator set membership zero knowledge blockchain"
  - type: "crossref_query"
    value: "Verkle tree vector commitment membership proof"
  - type: "crossref_query"
    value: "sparse Merkle tree zero knowledge circuit constraints"
  - type: "crossref_query"
    value: "RSA accumulator anonymous payments"
  - type: "crossref_query"
    value: "SNARK proof system benchmark comparison Groth16 PLONK STARK"
  - type: "crossref_query"
    value: "transparent setup SNARK universal trusted setup"
  - type: "crossref_query"
    value: "SNARK friendly hash function Poseidon circuit"
  - type: "crossref_query"
    value: "nullifier double spending anonymous credential"
  - type: "crossref_query"
    value: "privacy pools compliance regulatory zero knowledge"
  - type: "crossref_query"
    value: "gas cost on-chain SNARK verification Ethereum"
  # 10 Crossref queries — broad theme coverage
  - type: "crossref_query"
    value: "zk-SNARK cross-chain light client state proof"
  - type: "crossref_query"
    value: "delegating computation PCP MIP verifiable"
  - type: "crossref_query"
    value: "zero knowledge proof blockchain scalability"
  - type: "crossref_query"
    value: "Merkle proof aggregation SNARK succinct"
  - type: "crossref_query"
    value: "succinct non-interactive argument knowledge blockchain"
  - type: "crossref_query"
    value: "privacy preserving smart contract zero knowledge"
  - type: "crossref_query"
    value: "verifiable computation outsourcing cryptography"
  - type: "crossref_query"
    value: "blockchain interoperability cross-chain bridge"
  - type: "crossref_query"
    value: "polynomial commitment scheme SNARK STARK"
  - type: "crossref_query"
    value: "electronic voting zero knowledge receipt-free"

research_scope:
  seed_keywords:
    - "zero knowledge"
    - "blockchain"
    - "cross-chain"
    - "light client"
    - "SNARK"
    - "STARK"
    - "Merkle"
    - "verifiable computation"
    - "succinct"
    - "polynomial commitment"
    - "electronic voting"
    - "privacy preserving"
    - "state proof"
    - "cryptography"
    - "DeFi"
    - "swap"
    - "lending"
    - "collateral"
    - "mixer"
    - "proof of solvency"
  max_hops: 5
  max_papers_per_query: 150
  max_total_papers: 3000
  years_from: 2015
  years_to: 2026
  min_relevance_score: 0.25
  # New: minimum citation count to keep a paper (filters noise)
  min_citation_count: 0
  # New: minimum keyword overlap with seed_keywords (0..1)
  min_keyword_overlap: 0.0
  # New: enable topical ranking by OpenAlex concepts when key is set
  use_openalex_topical_filter: false
  # New: OpenAlex concept IDs (or slugs) that mark our topic
  # Cryptography: C15494532, Blockchain: C2778824950 — look these up at
  # https://api.openalex.org/concepts?search=blockchain
  target_concept_ids:
    - "C15494532"     # Cryptography
    - "C2778824950"   # Blockchain (variant)
    - "C41008148"     # Computer security
    - "C192562407"    # Distributed computing
    - "C121332964"    # Theoretical computer science

search:
  providers:
    - "tavily"
    - "ddg"
    - "semantic_scholar"
    - "arxiv"
    - "crossref"

llm:
  provider: "openai_compatible"
  base_url_env: "MINIMAX_BASE_URL"
  api_key_env: "MINIMAX_API_KEY"
  model: "MiniMax-Text-01"
  temperature: 0.1
  max_output_tokens: 4000
  concurrency: 4
  structured_output: true
  cache_responses: true

analysis:
  extract_abstract: true
  extract_problem: true
  extract_contribution: true
  extract_methods: true
  extract_limitations: false
  extract_future_work: true
  extract_metrics: false
  extract_authors: true
  extract_affiliations: true
  generate_project_ideas: false
  generate_advisor_shortlist: true

outputs:
  # Só o essencial — objetivo é baixar PDFs
  save_json: false
  save_html_graph: true
  save_graphml: false
  save_markdown_report: false
  save_csv: false
  save_gexf: false
  save_mermaid: false
  save_cytoscape_json: false
  # How many full-text PDFs to try downloading per run.
  # Set enable_pdf_download=true below to actually fetch them.
  max_papers_to_download: 100
  enable_pdf_download: true
  # Which providers may be used for PDF download, in priority order.
  # Providers not in the registry are skipped silently.
  pdf_download_providers:
    - "openalex"        # open-access full-text URLs (legal, no rate limit)
    - "unpaywall"       # legal OA index by DOI (needs OPENALEX_EMAIL)
    - "scidb"           # Anna's Archive SciDB by DOI (Sci-Hub continuation)
    - "scihub"          # opt-in Sci-Hub, returns PDFs by DOI
    - "annas"           # opt-in Anna's Archive search-by-title (last resort)
